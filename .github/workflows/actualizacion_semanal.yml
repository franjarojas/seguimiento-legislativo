name: Seguimiento Legislativo Semanal

on:
  schedule:
    # Cada lunes a las 11:00 AM hora Chile (UTC-3 → 14:00 UTC)
    - cron: '0 11 * * 1'
  workflow_dispatch:
    # Permite correr manualmente desde GitHub Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para hacer commit del Excel y estado actualizado

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests openpyxl beautifulsoup4 \
            google-auth google-auth-oauthlib google-api-python-client

      - name: Ejecutar script de actualización y reporte
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
        run: python scripts/actualizar_y_reportar.py

      - name: Commit del Excel y estado actualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seguimiento_legislativo.xlsx estado_anterior.json
          git diff --staged --quiet || git commit -m "chore: actualización semanal $(date +'%Y-%m-%d')"
          git push
